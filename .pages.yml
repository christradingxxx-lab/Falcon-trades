# Journal Desk configuration for Pages CMS (https://pagescms.org)
# Sign in at app.pagescms.org with GitHub, open this repository, and everything below appears as editable sections.

media:
  input: public/uploads
  output: /uploads

content:
  - name: journal
    label: Journal
    type: collection
    path: src/content/journal
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, type, visibility]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: visibility
        label: Visibility
        description: "Private entries are never published. Choose Public to show this entry on the website."
        type: select
        default: private
        required: true
        options:
          values:
            - { value: private, label: "Private (only me)" }
            - { value: public, label: "Public (on the website)" }
      - name: date
        label: Date
        type: date
        required: true
      - name: type
        label: Entry type
        type: select
        default: daily
        required: true
        options:
          values:
            - { value: daily, label: "Daily log" }
            - { value: weekly, label: "Weekly review" }
            - { value: monthly, label: "Monthly review" }
            - { value: quarterly, label: "Quarterly review" }
      - name: markets
        label: Markets
        type: select
        options:
          multiple: true
          values: [NQ, ES, MNQ, MES, YM, RTY, CL, GC, Stocks]
      - name: excerpt
        label: Short summary
        description: "One or two sentences shown on the journal list."
        type: text
      - name: cover
        label: Cover image (optional)
        type: image
      - name: setup
        label: Setup
        type: string
      - name: entry
        label: Entry price
        type: string
      - name: exit
        label: Exit price
        type: string
      - name: result
        label: Result (e.g. +2.1R)
        type: string
      - name: mindset
        label: Mindset and mistakes
        type: text
      - name: video
        label: YouTube link (optional)
        type: string
      - name: body
        label: Entry
        type: rich-text

  - name: playbooks
    label: Playbooks
    type: collection
    path: src/content/playbooks
    filename: "{primary}.md"
    view:
      fields: [title, market, published]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: published
        label: Show on website
        type: boolean
        default: false
      - name: summary
        label: Summary
        type: text
      - name: market
        label: Market
        type: string
      - name: order
        label: Order (1 shows first)
        type: number
        default: 1
      - name: cover
        label: Cover image
        type: image
      - name: pdf
        label: PDF download
        type: file
      - name: body
        label: Playbook
        type: rich-text

  - name: research
    label: Research
    type: collection
    path: src/content/research
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, published]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: published
        label: Show on website
        type: boolean
        default: false
      - name: date
        label: Date
        type: date
        required: true
      - name: summary
        label: Summary
        type: text
      - name: cover
        label: Cover image
        type: image
      - name: pdf
        label: Paper (PDF)
        type: file
      - name: body
        label: Article
        type: rich-text

  - name: tools
    label: Tools shop
    type: collection
    path: src/content/tools
    filename: "{primary}.md"
    view:
      fields: [name, price, published]
      primary: name
    fields:
      - name: name
        label: Product name
        type: string
        required: true
      - name: published
        label: Show on website
        type: boolean
        default: true
      - name: tagline
        label: One-line description
        type: text
      - name: platform
        label: Platform (e.g. NinjaTrader 8)
        type: string
      - name: price
        label: Price (e.g. US$49). Leave empty to show "Coming soon".
        type: string
      - name: buyUrl
        label: Checkout link (Gumroad / Lemon Squeezy)
        type: string
      - name: badge
        label: Badge (e.g. Most popular)
        type: string
      - name: image
        label: Product image
        type: image
      - name: features
        label: Key features
        type: string
        list: true
      - name: order
        label: Order (1 shows first)
        type: number
        default: 1
      - name: body
        label: Product description
        type: rich-text

  - name: videos
    label: Videos
    type: collection
    path: src/content/videos
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, topic, date]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: url
        label: YouTube link
        type: string
        required: true
      - name: topic
        label: Topic
        type: select
        default: Session recap
        options:
          values: [Session recap, Setup breakdown, Weekly review, Build log, Education]
      - name: date
        label: Date
        type: date
        required: true
      - name: description
        label: Short description
        type: text
      - name: published
        label: Show on website
        type: boolean
        default: true

  - name: about
    label: About me
    type: file
    path: src/data/about.json
    fields:
      - name: name
        label: Name
        type: string
      - name: portrait
        label: Portrait photo
        type: image
      - name: headline
        label: Headline
        type: text
      - name: intro
        label: Introduction
        type: text
      - name: from
        label: From
        type: string
      - name: basedIn
        label: Based in
        type: string
      - name: trades
        label: Trades
        type: string
      - name: tradingSince
        label: Trading since
        type: string
      - name: chapters
        label: My story (chapters)
        type: object
        list: true
        fields:
          - { name: label, label: Chapter label, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: motto
        label: Personal motto or verse
        type: text
      - name: mottoSource
        label: Motto source
        type: string
      - name: principles
        label: Principles
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }

  - name: settings
    label: Site settings & social links
    type: file
    path: src/data/settings.json
    fields:
      - name: brand
        label: Brand name
        type: string
      - name: established
        label: Established (year)
        type: string
      - name: siteDescription
        label: Site description (for Google)
        type: text
      - name: heroEyebrow
        label: Home - small heading
        type: string
      - name: heroTitle
        label: Home - title line 1
        type: string
      - name: heroTitleAccent
        label: Home - title line 2 (gold)
        type: string
      - name: heroText
        label: Home - intro text
        type: text
      - name: youtube
        label: YouTube channel link
        type: string
      - name: facebook
        label: Facebook link
        type: string
      - name: instagram
        label: Instagram link
        type: string
      - name: tiktok
        label: TikTok link
        type: string
      - name: x
        label: X (Twitter) link
        type: string
      - name: email
        label: Contact email (shown publicly)
        type: string
      - name: newsletterTitle
        label: Newsletter title
        type: string
      - name: newsletterText
        label: Newsletter text
        type: text
      - name: newsletterUrl
        label: Newsletter signup link (leave empty to hide)
        type: string
      - name: disclaimer
        label: Risk disclaimer
        type: text
